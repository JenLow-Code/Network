name: Frontend validation
on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-validation.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-validation.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: dependencies
        run: npm install --no-audit --no-fund
      - name: Check unified desktop page canvases
        run: npm run verify:layout
      - name: Verify Agenda projection and local date behavior
        run: npm run verify:agenda
      - name: Verify theme contrast and navigation invariants
        run: npm run verify:theme
      - name: Verify MIDI import-export roundtrip
        run: npm run verify:midi
      - name: Verify lyric annotations and comments
        run: npm run verify:lyrics
      - name: Verify personal music opens the workspace (never the public player)
        run: npm run verify:music-routing
      - name: Verify authenticated access and session inactivity policy
        run: npm run verify:auth-gate
      - name: Verify score scanner never accepts a collapsed multi-staff result
        run: npm run verify:score-scan
      - name: Typecheck independently of regression failures
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npm run typecheck
      - name: Validate Expo web export
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npx expo export --platform web
      - name: Validate native Android JS export
        run: npx expo export --platform android
      - name: Validate native iOS JS export
        run: npx expo export --platform ios
