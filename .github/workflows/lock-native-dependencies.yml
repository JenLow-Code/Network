name: Pin native app dependencies
on:
  push:
    paths:
      - '.github/workflows/lock-native-dependencies.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lock-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate npm 10 dependency lockfile
        working-directory: frontend
        run: |
          npm --version
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify reproducible installation
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx expo install --check
          npm run typecheck
          npx expo config --type prebuild --json > /tmp/expo-native-config.json
      - name: Commit the verified dependency lockfile
        run: |
          git config user.name "jenlow-ci[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(eas): commit verified npm 10 lockfile for native builds"
            git push
          fi
