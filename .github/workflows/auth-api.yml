name: Network API checks
on:
  push:
    paths:
      - 'middleware/**'
      - 'database/**'
      - '.github/workflows/auth-api.yml'
  pull_request:
    paths:
      - 'middleware/**'
      - 'database/**'
  workflow_dispatch:
jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: middleware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Typecheck Worker and tests
        run: npm run typecheck
      - name: Integration tests (all migrations, D1-compatible SQLite, HTTP API)
        run: npm test
      - name: Bundle the Worker (Cloudflare ESM, nodejs_compat)
        run: npm run bundle:check
      - name: Demo seed is up to date with demo-data.ts
        run: |
          npm run seed:sql
          git diff --exit-code ../database/seeds/demo_seed.sql
