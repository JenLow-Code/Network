name: Network and JenLow Core integration
on:
  push:
    paths: ['api/network/**','core.lock.json','.github/workflows/auth-api.yml']
  pull_request:
    paths: ['api/network/**','core.lock.json','.github/workflows/auth-api.yml','middleware/**','database/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: core
        name: Read pinned Core revision
        run: |
          ref=$(jq -er '.commit | select(test("^[a-f0-9]{40}$"))' core.lock.json)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: JenLow-Code/core
          ref: ${{ steps.core.outputs.ref }}
          path: .core
          persist-credentials: false
      - name: Verify isolation and test the actual Network gateway
        run: |
          test "$(git -C .core rev-parse HEAD)" = "$(jq -r .commit core.lock.json)"
          test ! -e .core/middleware/src/services/notifications.ts
          cp api/network/src/index.ts .core/middleware/test/fixtures/networkGateway.ts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: .core/middleware
      - run: npm run typecheck && npm test && npm run bundle:check
        working-directory: .core/middleware
      - name: Bundle Network gateway
        run: .core/middleware/node_modules/.bin/esbuild api/network/src/index.ts --bundle --format=esm --platform=neutral --outfile=/tmp/network-gateway.js --log-level=warning
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .core/database/test_schema.py
