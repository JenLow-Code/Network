name: Auth API checks
on:
  push:
    paths:
      - 'middleware/**'
      - 'database/**'
      - '.github/workflows/auth-api.yml'
  pull_request:
    paths:
      - 'middleware/**'
      - 'database/**'
  workflow_dispatch:
jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: middleware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
